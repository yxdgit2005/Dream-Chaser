
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智囊团 - 建议与排行榜</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-lightbulb text-indigo-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-gray-800 tracking-tight">智囊团</span>
                </div>
                <div class="flex items-center space-x-4" id="nav-actions">
                    <!-- Dynamic Content based on auth state -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 relative" id="main-container">
        <!-- Views will be injected here by JavaScript -->
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- JavaScript Logic -->
    <script>
        // --- State Management & Mock Database ---
        const AppState = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('app_users')) || [],
            suggestions: JSON.parse(localStorage.getItem('app_suggestions')) || []
        };

        // Initialize some dummy data if empty
        if (AppState.suggestions.length === 0) {
            AppState.suggestions = [
                { id: 1, userId: 'admin', username: '产品经理', title: '增加深色模式', content: '用户经常在夜间使用，希望增加深色模式保护视力。', likes: 128, timestamp: Date.now() - 100000 },
                { id: 2, userId: 'user2', username: '设计师Alice', title: '优化加载动画', content: '目前的加载动画太单调，建议使用Lottie动画提升趣味性。', likes: 85, timestamp: Date.now() - 200000 },
                { id: 3, userId: 'user3', username: '开发者Bob', title: '支持离线缓存', content: '在网络不佳的情况下，应该能查看之前加载过的内容。', likes: 42, timestamp: Date.now() - 300000 }
            ];
            saveData();
        }

        function saveData() {
            localStorage.setItem('app_users', JSON.stringify(AppState.users));
            localStorage.setItem('app_suggestions', JSON.stringify(AppState.suggestions));
        }

        // --- Utility Functions ---
        function generateId() {
            return '_' + Math.random().toString(36).substr(2, 9);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            toast.className = `${colors} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 fade-in transform transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- View Rendering Functions ---

        function renderNav() {
            const navActions = document.getElementById('nav-actions');
            if (AppState.currentUser) {
                navActions.innerHTML = `
                    <button onclick="switchView('submit')" class="text-gray-600 hover:text-indigo-600 font-medium transition"><i class="fa-solid fa-pen-nib mr-1"></i> 提交建议</button>
                    <button onclick="switchView('leaderboard')" class="text-gray-600 hover:text-indigo-600 font-medium transition"><i class="fa-solid fa-trophy mr-1"></i> 排行榜</button>
                    <div class="flex items-center gap-2 ml-4 border-l pl-4 border-gray-200">
                        <span class="text-sm font-medium text-gray-700">${AppState.currentUser.username}</span>
                        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;
            } else {
                navActions.innerHTML = `
                    <button onclick="switchView('login')" class="text-indigo-600 font-medium hover:text-indigo-800 transition">登录</button>
                    <button onclick="switchView('register')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition shadow-sm">注册</button>
                `;
            }
        }

        function switchView(viewName) {
            const main = document.getElementById('main-container');
            main.innerHTML = ''; // Clear current view
            
            switch(viewName) {
                case 'login':
                    renderLogin(main);
                    break;
                case 'register':
                    renderRegister(main);
                    break;
                case 'submit':
                    if (!AppState.currentUser) {
                        showToast('请先登录', 'error');
                        renderLogin(main);
                        return;
                    }
                    renderSubmit(main);
                    break;
                case 'leaderboard':
                    renderLeaderboard(main);
                    break;
                default:
                    // Default to leaderboard if logged in, else login
                    if (AppState.currentUser) renderLeaderboard(main);
                    else renderLogin(main);
            }
            renderNav();
        }

        // 1. Login View
        function renderLogin(container) {
            container.innerHTML = `
                <div class="flex items-center justify-center h-full fade-in">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-gray-800">欢迎回来</h2>
                            <p class="text-gray-500 mt-2">登录以参与建议投票</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="username" required class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="请输入用户名">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" name="password" required class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="请输入密码">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                立即登录
                            </button>
                        </form>
                        <div class="mt-6 text-center text-sm text-gray-600">
                            还没有账号？ <button onclick="switchView('register')" class="text-indigo-600 font-medium hover:underline">立即注册</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. Register View
        function renderRegister(container) {
            container.innerHTML = `
                <div class="flex items-center justify-center h-full fade-in">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-gray-800">创建账号</h2>
                            <p class="text-gray-500 mt-2">加入智囊团，分享你的见解</p>
                        </div>
                        <form onsubmit="handleRegister(event)" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" name="username" required class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="设置用户名">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" name="password" required minlength="6" class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="至少6位字符">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-check-double"></i></span>
                                    <input type="password" name="confirmPassword" required class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="再次输入密码">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                注册账号
                            </button>
                        </form>
                        <div class="mt-6 text-center text-sm text-gray-600">
                            已有账号？ <button onclick="switchView('login')" class="text-indigo-600 font-medium hover:underline">直接登录</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 3. Submit Suggestion View
        function renderSubmit(container) {
            container.innerHTML = `
                <div class="max-w-3xl mx-auto fade-in">
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="bg-indigo-600 px-8 py-6">
                            <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-paper-plane mr-2"></i> 提交新建议</h2>
                            <p class="text-indigo-100 mt-1">您的想法可能改变世界，请详细描述。</p>
                        </div>
                        <div class="p-8">
                            <form onsubmit="handleSubmitSuggestion(event)">
                                <div class="mb-6">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">建议标题</label>
                                    <input type="text" name="title" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="简明扼要地概括您的建议">
                                </div>
                                <div class="mb-6">
                                    <label class="block text-sm font-medium text-gray-700 mb-2">详细内容</label>
                                    <textarea name="content" required rows="6" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="请详细描述您的建议背景、实施方案及预期效果..."></textarea>
                                </div>
                                <div class="flex justify-end gap-4">
                                    <button type="button" onclick="switchView('leaderboard')" class="px-6 py-3 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition">取消</button>
                                    <button type="submit" class="px-8 py-3 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition shadow-md">发布建议</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. Leaderboard View
        function renderLeaderboard(container) {
            // Sort suggestions by likes descending
            const sortedSuggestions = [...AppState.suggestions].sort((a, b) => b.likes - a.likes);
            
            let listHtml = '';
            if (sortedSuggestions.length === 0) {
                listHtml = `<div class="text-center py-12 text-gray-500">暂无建议，成为第一个提交的人吧！</div>`;
            } else {
                sortedSuggestions.forEach((item, index) => {
                    const rank = index + 1;
                    let rankBadge = '';
                    if (rank === 1) rankBadge = '<i class="fa-solid fa-crown text-yellow-400 text-xl drop-shadow-sm"></i>';
                    else if (rank === 2) rankBadge = '<i class="fa-solid fa-medal text-gray-400 text-xl"></i>';
                    else if (rank === 3) rankBadge = '<i class="fa-solid fa-medal text-amber-600 text-xl"></i>';
                    else rankBadge = `<span class="font-bold text-gray-400 text-lg w-6 text-center">${rank}</span>`;

                    const isLikedByMe = AppState.currentUser && item.likedBy && item.likedBy.includes(AppState.currentUser.username);
                    const likeBtnClass = isLikedByMe ? 'text-red-500' : 'text-gray-400 hover:text-red-500';
                    const likeAction = AppState.currentUser ? `toggleLike(${item.id})` : `showToast('请先登录', 'error')`;

                    listHtml += `
                        <div class="bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition border border-gray-100 flex gap-4 items-start">
                            <div class="flex-shrink-0 w-12 flex flex-col items-center justify-center">
                                ${rankBadge}
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <h3 class="text-lg font-bold text-gray-800 mb-1">${item.title}</h3>
                                    <span class="text-xs text-gray-400 bg-gray-50 px-2 py-1 rounded">${formatDate(item.timestamp)}</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-3 leading-relaxed">${item.content}</p>
                                <div class="flex items-center justify-between mt-2">
                                    <div class="flex items-center gap-2">
                                        <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold">
                                            ${item.username.charAt(0).toUpperCase()}
                                        </div>
                                        <span class="text-sm text-gray-500 font-medium">${item.username}</span>
                                    </div>
                                    <button onclick="${likeAction}" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-red-50 transition group">
                                        <i class="fa-solid fa-heart ${likeBtnClass} group-active:scale-125 transition-transform"></i>
                                        <span class="text-sm font-medium ${isLikedByMe ? 'text-red-500' : 'text-gray-500'}">${item.likes}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="flex justify-between items-end mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">热门建议排行榜</h2>
                            <p class="text-gray-500 text-sm mt-1">基于用户点赞数实时排序</p>
                        </div>
                        ${AppState.currentUser ? `<button onclick="switchView('submit')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition shadow-sm"><i class="fa-solid fa-plus mr-1"></i> 新增建议</button>` : ''}
                    </div>
                    <div class="space-y-4">
                        ${listHtml}
                    </div>
                </div>
            `;
        }

        // --- Event Handlers ---

        function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');

            const user = AppState.users.find(u => u.username === username && u.password === password);
            
            if (user) {
                AppState.currentUser = user;
                showToast(`欢迎回来, ${user.username}!`);
                switchView('leaderboard');
            } else {
                showToast('用户名或密码错误', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');

            if (password !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            if (AppState.users.find(u => u.username === username)) {
                showToast('该用户名已被注册', 'error');
                return;
            }

            const newUser = {
                id: generateId(),
                username: username,
                password: password // In real app, hash this!
            };

            AppState.users.push(newUser);
            saveData();
            
            // Auto login after register
            AppState.currentUser = newUser;
            showToast('注册成功！');
            switchView('leaderboard');
        }

        function logout() {
            AppState.currentUser = null;
            showToast('已退出登录');
            switchView('login');
        }

        function handleSubmitSuggestion(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const title = formData.get('title');
            const content = formData.get('content');

            const newSuggestion = {
                id: Date.now(),
                userId: AppState.currentUser.id,
                username: AppState.currentUser.username,
                title: title,
                content: content,
                likes: 0,
                likedBy: [],
                timestamp: Date.now()
            };

            AppState.suggestions.push(newSuggestion);
            saveData();
            showToast('建议发布成功！');
            switchView('leaderboard');
        }

        function toggleLike(id) {
            if (!AppState.currentUser) {
                showToast('请先登录', 'error');
                return;
            }

            const suggestion = AppState.suggestions.find(s => s.id === id);
            if (!suggestion) return;

            if (!suggestion.likedBy) suggestion.likedBy = [];

            const userIndex = suggestion.likedBy.indexOf(AppState.currentUser.username);
            
            if (userIndex === -1) {
                // Like
                suggestion.likes++;
                suggestion.likedBy.push(AppState.currentUser.username);
                showToast('点赞成功');
            } else {
                // Unlike
                suggestion.likes--;
                suggestion.likedBy.splice(userIndex, 1);
            }

            saveData();
            // Re-render to update UI
            renderLeaderboard(document.getElementById('main-container'));
        }

        // --- Initialization ---
        window.onload = function() {
            // Check if there's a "remember me" logic or just default to login
            // For this demo, we start at login if not logged in, or leaderboard if logged in
            // Since it's local storage session based, we reset on refresh unless we persist session
            // Let's persist session simply by checking if currentUser was set in a real app, 
            // but here we'll just default to Login screen for security demonstration, 
            // OR we can check a 'session' key. Let's keep it simple: Start at Login.
            switchView('login');
        };

    </script>
</body>
</html>
