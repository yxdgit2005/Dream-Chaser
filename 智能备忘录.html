
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能每日回顾备忘录</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Review Stats -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .memo-card {
            transition: all 0.3s ease;
        }
        .memo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 tracking-tight">DailyMemo <span class="text-xs font-normal text-gray-500 ml-1">v1.0</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="app.toggleReviewModal()" class="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 rounded-full hover:bg-indigo-100 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-chart-pie"> 每日回顾
                </button>
                <button onclick="app.exportLogs()" class="flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-full hover:bg-gray-200 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-download"> 导出日志
                </button>
                <div class="relative group">
                    <button class="p-2 text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar / Filters -->
        <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
            <div class="p-6">
                <button onclick="app.openAddModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新建备忘
                </button>
            </div>
            
            <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
                <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">视图筛选</div>
                <button onclick="app.filterMemos('all')" class="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg bg-indigo-50 text-indigo-700">
                    <i class="fa-solid fa-layer-group w-5"></i> 全部备忘
                </button>
                <button onclick="app.filterMemos('pending')" class="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50">
                    <i class="fa-regular fa-clock w-5"></i> 待处理
                </button>
                <button onclick="app.filterMemos('completed')" class="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50">
                    <i class="fa-regular fa-circle-check w-5"></i> 已完成
                </button>
                <button onclick="app.filterMemos('overdue')" class="w-full flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50">
                    <i class="fa-solid fa-triangle-exclamation w-5 text-red-500"></i> 已过期
                </button>

                <div class="mt-8 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-2">统计概览</div>
                <div class="px-2 space-y-3">
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <div class="text-xs text-gray-500">今日待办</div>
                        <div class="text-xl font-bold text-gray-800" id="stat-today">0</div>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <div class="text-xs text-gray-500">本周完成</div>
                        <div class="text-xl font-bold text-green-600" id="stat-week">0</div>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Memo List Area -->
        <section class="flex-1 flex flex-col bg-gray-50 relative">
            <!-- Search Bar -->
            <div class="p-6 pb-2">
                <div class="relative max-w-2xl">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索标题、内容或标签..." 
                           class="w-full pl-10 pr-4 py-3 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-indigo-500 bg-white text-gray-700 placeholder-gray-400 transition-all"
                           oninput="app.handleSearch(this.value)">
                </div>
            </div>

            <!-- List Container -->
            <div id="memoList" class="flex-1 overflow-y-auto p-6 pt-2 space-y-4">
                <!-- Memos will be injected here -->
            </div>
            
            <!-- Empty State (Hidden by default) -->
            <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                <i class="fa-regular fa-clipboard text-6xl mb-4 text-gray-300"></i>
                <p class="text-lg">暂无备忘记录</p>
                <button onclick="app.openAddModal()" class="mt-4 text-indigo-600 hover:underline">创建第一个备忘</button>
            </div>
        </section>
    </main>

    <!-- Add/Edit Modal -->
    <div id="memoModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm transition-opacity" onclick="app.closeModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform transition-all scale-100 fade-in">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-gray-900" id="modalTitle">新建备忘</h3>
                    <button onclick="app.closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <form id="memoForm" onsubmit="app.saveMemo(event)" class="p-6 space-y-4">
                    <input type="hidden" id="memoId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                        <input type="text" id="memoTitle" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="输入备忘标题">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">内容</label>
                        <textarea id="memoContent" rows="4" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none" placeholder="详细描述..."></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">提醒时间</label>
                            <input type="datetime-local" id="memoTime" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                            <select id="memoPriority" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                                <option value="low">低优先级</option>
                                <option value="medium" selected>中优先级</option>
                                <option value="high">高优先级</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end gap-3">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">取消</button>
                        <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-colors font-medium">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Daily Review Modal -->
    <div id="reviewModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="app.toggleReviewModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[80vh] flex flex-col fade-in">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-indigo-50 rounded-t-2xl">
                    <div>
                        <h3 class="text-xl font-bold text-indigo-900">每日回顾 Dashboard</h3>
                        <p class="text-sm text-indigo-600 mt-1" id="reviewDateDisplay"></p>
                    </div>
                    <button onclick="app.toggleReviewModal()" class="text-indigo-400 hover:text-indigo-700 bg-white p-2 rounded-full shadow-sm">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Chart Section -->
                    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex flex-col">
                        <h4 class="font-semibold text-gray-700 mb-4">完成状态分布</h4>
                        <div class="flex-1 relative">
                            <canvas id="reviewChart"></canvas>
                        </div>
                    </div>

                    <!-- Stats & Logs -->
                    <div class="space-y-6">
                        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 text-white shadow-lg">
                            <h4 class="font-medium opacity-90 mb-1">今日效率</h4>
                            <div class="text-4xl font-bold mb-2" id="efficiencyScore">0%</div>
                            <p class="text-sm opacity-80" id="efficiencyText">保持专注，继续加油！</p>
                        </div>

                        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm h-64 flex flex-col">
                            <h4 class="font-semibold text-gray-700 mb-2">最近操作日志</h4>
                            <div id="logPreview" class="flex-1 overflow-y-auto text-xs space-y-2 font-mono text-gray-600 bg-gray-50 p-2 rounded">
                                <!-- Logs injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
            <i class="fa-solid fa-circle-check text-green-400"></i>
            <span id="toastMessage">操作成功</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
